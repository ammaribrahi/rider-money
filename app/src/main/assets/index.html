body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;max-width:520px;margin-inline:auto;padding:12px 12px 90px;line-height:1.5}

.ch button.on{background:var(--ac);color:#fff}
.q span{background:var(--bd);padding:6px 12px;border-radius:20px;font-size:14px;display:inline-block;margin-bottom:8px}
.bar{height:8px;border-radius:4px;margin-top:3px}
.x{width:auto;padding:4px 10px;background:var(--bd);color:var(--tx);margin:0;font-size:14px}
.ob{border-inline-start:6px solid;padding:8px 10px;margin-bottom:8px;background:var(--bg);border-radius:10px}
